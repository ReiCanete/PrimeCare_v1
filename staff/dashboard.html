<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PRIMECARE</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="dashboard" data-area="staff">

    <div id="app-shell"></div>

    <main id="page-content">
        <!-- Header & Greeting -->
        <div class="dashboard-header">
            <div class="greeting-card" id="greeting-card">
                <!-- Injected via JS -->
            </div>
            <div style="text-align: right;">
                <div id="last-updated" style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.5rem;"></div>
                <button class="btn btn-outline" onclick="refreshDashboard()">↻ Refresh Data</button>
            </div>
        </div>

        <!-- Main Stats -->
        <div class="grid grid-4" id="main-stats" style="margin-bottom: 1.5rem;">
            <!-- Injected via JS -->
        </div>

        <!-- Role Specific Stats -->
        <div class="grid grid-4" id="role-stats" style="margin-bottom: 2rem;">
            <!-- Injected via JS -->
        </div>

        <!-- Two Column Section A -->
        <div class="grid grid-2" style="margin-bottom: 2rem;">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h3>Today's Appointments</h3>
                    <a href="#" style="font-size: 0.875rem; color: var(--teal); text-decoration: none;">View All</a>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr id="appt-table-head">
                                <!-- Injected via JS -->
                            </tr>
                        </thead>
                        <tbody id="appt-table-body">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="card">
                <h3 style="margin-bottom: 1rem;">Quick Actions</h3>
                <div class="quick-actions-grid" id="quick-actions">
                    <!-- Injected via JS -->
                </div>
            </div>
        </div>

        <!-- Two Column Section B -->
        <div class="grid grid-2" style="margin-bottom: 2rem;">
            <div class="card" id="section-pending" style="display: none;">
                <h3 style="margin-bottom: 1rem;">Pending Verifications</h3>
                <div class="list-group" id="pending-list"></div>
            </div>
            
            <div class="card" id="section-labs" style="display: none;">
                <h3 style="margin-bottom: 1rem; color: var(--danger);">Critical Lab Results</h3>
                <div class="list-group" id="labs-list"></div>
            </div>
        </div>

        <!-- Third Section: Charts & Activity -->
        <div class="grid grid-3">
            <div class="card">
                <h3 style="margin-bottom: 1rem;">Appointments This Week</h3>
                <div class="chart-container" id="appt-chart"></div>
            </div>
            
            <div class="card">
                <h3 style="margin-bottom: 1rem;">Ward Occupancy</h3>
                <div id="ward-progress"></div>
            </div>
            
            <div class="card">
                <h3 style="margin-bottom: 1rem;">Recent Activity</h3>
                <div class="timeline" id="recent-activity"></div>
            </div>
        </div>
    </main>

    <script src="../js/data.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - PRIMECARE</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="forgot-password" data-area="auth">

    <div class="auth-layout">
        <div class="auth-content" style="margin: 0 auto; max-width: 500px; box-shadow: none; background: transparent;">
            <div class="card" style="box-shadow: var(--shadow-md);">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <img src="assets/primecare.png" alt="Logo" style="height: 40px; object-fit: contain; margin-bottom: 1rem;">
                    <h2 style="color: var(--navy);">Reset Password</h2>
                </div>

                <div id="alert-container"></div>

                <!-- Step 1: Request -->
                <div id="forgot-step1">
                    <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem; text-align: center;">Enter your username and registered email address to receive a verification code.</p>
                    <form id="forgot-step1-form">
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" id="f-username" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="f-email" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Send Code</button>
                    </form>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <a href="login.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.875rem;">&larr; Back to Login</a>
                    </div>
                </div>

                <!-- Step 2: Verify & Reset -->
                <div id="forgot-step2" style="display: none;">
                    <div class="demo-box" style="margin-bottom: 1.5rem; text-align: center; margin-top: 0;">
                        <strong>🛠️ Demo Mode SMS:</strong><br>
                        Code: <span id="demo-reset-code" style="font-size: 1.25rem; font-weight: bold; color: var(--navy);"></span>
                    </div>
                    <form id="forgot-step2-form">
                        <div class="form-group">
                            <label>6-Digit Code</label>
                            <input type="text" id="f-code" class="form-control" required maxlength="6" style="text-align: center; letter-spacing: 2px;">
                        </div>
                        <div class="form-group">
                            <label>New Password</label>
                            <input type="password" id="f-password" class="form-control" required>
                            <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem;">Min 8 chars, 1 uppercase, 1 number</div>
                        </div>
                        <div class="form-group">
                            <label>Confirm New Password</label>
                            <input type="password" id="f-confirm" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Reset Password</button>
                    </form>
                </div>

                <!-- Step 3: Success -->
                <div id="forgot-step3" style="display: none; text-align: center; padding: 2rem 0;">
                    <div style="width: 48px; height: 48px; background: var(--success-bg); color: var(--success); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 1rem;">✓</div>
                    <h3 style="color: var(--navy); margin-bottom: 1rem;">Password Reset Successful</h3>
                    <p style="color: var(--text-muted); margin-bottom: 2rem;">You can now log in with your new password.</p>
                    <a href="login.html" class="btn btn-primary">Go to Login</a>
                </div>

            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>

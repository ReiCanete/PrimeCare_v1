<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Information - PRIMECARE</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="visitor-info" data-area="public">

    <div id="public-nav"></div>

    <main style="padding: 2rem; max-width: 800px; margin: 0 auto;">
        <h1 style="margin-bottom: 1rem;">Visitor Information & Guidelines</h1>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">For the safety and comfort of our patients, please observe the following guidelines when visiting PRIMECARE.</p>

        <div id="accordion-container">
            <!-- Accordions injected here -->
        </div>
    </main>

    <div id="public-footer"></div>

    <script src="js/data.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/public.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const info = await safeCall('getVisitorInfo');
            const container = document.getElementById('accordion-container');

            if (!info || Object.keys(info).length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-muted);">Visitor information is currently unavailable.</div>';
                return;
            }

            const hoursTable = `
                <table class="table" style="margin-top: 1rem;">
                    <thead><tr><th>Area</th><th>Visiting Hours</th></tr></thead>
                    <tbody>
                        ${(info.visitingHours || []).map(vh => `<tr><td><strong>${vh.area}</strong></td><td>${vh.hours}</td></tr>`).join('')}
                    </tbody>
                </table>
            `;

            const sections = [
                { title: "Visiting Hours", content: hoursTable },
                { title: "ICU Protocols", content: `<p style="margin-top: 1rem;">${info.icuProtocols || 'N/A'}</p>` },
                { title: "Infection Control", content: `<p style="margin-top: 1rem;">${info.infectionControl || 'N/A'}</p>` },
                { title: "Parking Information", content: `<p style="margin-top: 1rem;">${info.parking || 'N/A'}</p>` },
                { title: "Cafeteria Schedule", content: `<p style="margin-top: 1rem;">${info.cafeteria || 'N/A'}</p>` }
            ];

            container.innerHTML = sections.map((sec, index) => `
                <div class="accordion-item">
                    <button class="accordion-btn ${index === 0 ? 'active' : ''}">
                        ${sec.title}
                        <span>▼</span>
                    </button>
                    <div class="accordion-content" style="display: ${index === 0 ? 'block' : 'none'};">
                        ${sec.content}
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.accordion-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    btn.classList.toggle('active');
                    const content = btn.nextElementSibling;
                    content.style.display = content.style.display === 'block' ? 'none' : 'block';
                });
            });
        });
    </script>
</body>
</html>
